  description: The IYK API provides primitives for building digi-physical experiences.
    Core endpoints manage chips (NFC tags such as NTAG 424, KONG, and ARX HaLo), chip
    groups, items, taps/refs (validated physical interactions with replay protection),
    OTP codes (30-minute one-time passwords for NFT transfers and minting), and phygitals.
    Module endpoints cover POAP Events and Guestbook Events, and a Self-Service surface
    manages POAP devices. Authentication is via an x-iyk-api-key request header.
