aid: iyk
name: IYK
description: IYK provides useful primitives and apps for building digi-physical (phygital)
  experiences, connecting physical products and merchandise to blockchain tokens, POAPs,
  and digital content through NFC chips. The IYK API exposes three categories of endpoints
  - Core (chips, chip groups, items, taps/refs, OTP codes, and phygitals), Modules
  (POAP Events and Guestbook Events), and Self-Service POAP Devices - letting brands
  and artists chip physical items, verify authentic taps, gate content and rewards,
  mint or transfer linked NFTs, and recognize fans who show up. IYK Music applies the
  same primitives to fan engagement, turning chipped merch and show check-ins into a
  living fan identity. IYK is backed by a16z.
